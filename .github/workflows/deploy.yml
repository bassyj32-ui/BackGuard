name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Copy the pose WASM runtime into public
        run: |
          mkdir -p public/model/wasm
          cp node_modules/@mediapipe/tasks-vision/wasm/* public/model/wasm/

      # The .task model is not shipped in the npm package and is not committed.
      # Fetch it at build time so form feedback works on the deployed site
      # without a 5.7 MB binary in git history.
      - name: Fetch the pose model
        run: |
          curl -fsSL -o public/model/pose_landmarker_lite.task \
            "https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task" \
            || echo "::warning title=Pose model fetch failed::camera coaching will be disabled on the deployed site."

      - run: npm run build
      - run: npm run typecheck

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4